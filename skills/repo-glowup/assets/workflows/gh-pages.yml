# Deploy a static landing page to GitHub Pages on every push to main.
#
# Uses the modern Actions-based deployment (upload-pages-artifact + deploy-pages),
# not the legacy push-to-a-gh-pages-branch approach — no branch to keep in sync,
# no bot commits cluttering history.
#
# One step this workflow cannot do for you: on first use, go to
# Settings > Pages > Build and deployment > Source, and set it to "GitHub Actions".
# Until that's set, this workflow will run but the deploy step will fail.
#
# Set SOURCE_DIR to wherever index.html lives. If the site has its own build step
# (a bundler, a static-site generator), add a build job before the upload step and
# point SOURCE_DIR at its output directory instead of the source.

name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "www/**"
      - "landing/**"
      - "landing-page/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

env:
  SOURCE_DIR: docs

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; let an in-progress run finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the landing page exists
        run: |
          test -f "${SOURCE_DIR}/index.html" || {
            echo "::error::No ${SOURCE_DIR}/index.html — nothing to deploy. Check SOURCE_DIR."
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SOURCE_DIR }}

      - id: deployment
        uses: actions/deploy-pages@v4
